<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudio TME Fisioterapia</title>
<meta name="description" content="Aplicación de campo del estudio de síntomas musculoesqueléticos en fisioterapeutas (UCSS 2026).">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
</head>
<body>
<style>
/* Layout: cuaderno de campo clínico — barra superior con dos vistas; encuesta en pasos con riel de progreso; panel en rejilla de tarjetas */
:root{
  --bg:#F5F9FC; --surface:#FFFFFF; --surface-2:#EEF4F8; --ink:#1B3440; --ink-2:#47606B; --muted:#6B8290;
  --line:#DCE8EE; --primary:#0B8191; --primary-ink:#FFFFFF; --primary-soft:#DDF4F6;
  --accent:#D9661F; --accent-soft:#FFEBDD;
  --good:#23845A; --good-soft:#DDF5E8; --warn:#A06A00; --warn-soft:#FFF1CC; --bad:#C2413A; --bad-soft:#FDE3E1;
  --s1:#14A3B5; --s2:#F2913D;
  --seq1:#D4F0F3; --seq2:#9EDCE4; --seq3:#52BCCB; --seq4:#1A9DAE; --seq5:#0B7F8E;
  --grad:linear-gradient(135deg,#E2F6F8 0%,#EEF1FF 55%,#FFF0E3 100%);
  --shadow:0 1px 2px rgba(27,52,64,.05),0 8px 24px rgba(27,52,64,.06);
  --shadow-lg:0 2px 4px rgba(27,52,64,.05),0 18px 40px rgba(11,129,145,.14);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px; --r-sm:9px; --topbar-h:60px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.3rem,3vw,1.7rem);font-weight:700;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;letter-spacing:.01em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;flex:none}
.brand-mark svg{width:22px;height:22px}
.brand b{font-family:var(--f-display);font-size:1.02rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem}
.tabs{margin-left:auto;display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.tabs a{text-decoration:none;color:var(--ink-2);padding:7px 14px;border-radius:999px;font-weight:700;font-size:.9rem;transition:background .2s,color .2s}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 80px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r-sm);font-size:.9rem;margin-bottom:14px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner.good{background:var(--good-soft);border-color:transparent}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;transition:transform .15s ease,box-shadow .2s,background .2s;min-height:44px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#14A3B5,#0B8191);color:var(--primary-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 35%,transparent)}
.btn-primary:hover{box-shadow:0 8px 22px color-mix(in srgb,var(--primary) 45%,transparent)}
.btn-ghost{background:var(--surface);color:var(--ink-2);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);transform:translateY(-1px)}
.btn-accent{background:linear-gradient(135deg,#F2913D,#D9661F);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}

/* ---------- encuesta: layout ---------- */
.survey{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.rail{position:sticky;top:calc(var(--topbar-h) + 22px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail li button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px;cursor:pointer;font-size:.92rem;color:var(--ink-2)}
.rail li button:hover{background:var(--surface-2)}
.rail li button[aria-current="step"]{background:var(--primary-soft);color:var(--ink);font-weight:700}
.rail .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;border:1.5px solid var(--line);background:var(--surface);transition:all .25s}
.rail li.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.rail li button[aria-current="step"] .dot{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.rail .who{font-size:.72rem;color:var(--muted);display:block;line-height:1.2}
.rail-foot{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:.82rem;color:var(--muted)}
.mobile-progress{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.step{padding:clamp(18px,3vw,30px);animation:stepIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes stepIn{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
.step-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.step-head .meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.chip.p{background:var(--primary-soft);color:var(--primary)}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.chip.g{background:var(--good-soft);color:var(--good)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.b{background:var(--bad-soft);color:var(--bad)}
.lead{color:var(--ink-2);max-width:68ch}
.navbar{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.err{color:var(--bad);font-size:.85rem;font-weight:700;min-height:1.2em}

/* ---------- formularios ---------- */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.q-label{font-weight:700;font-size:.93rem}
.field small{color:var(--muted);font-size:.8rem}
.input,select.input,textarea.input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px;transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.input.invalid,.q.invalid{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}
.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.section-title .tag{font-family:var(--f-mono);font-size:.78rem;background:var(--ink);color:var(--surface);padding:2px 8px;border-radius:6px}
.q{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;background:var(--surface);transition:border-color .2s}
.q + .q{margin-top:10px}
.q-head{display:flex;gap:10px;align-items:baseline}
.q-num{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);min-width:2.2em}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;cursor:pointer}
.pill span{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);font-size:.88rem;cursor:pointer;transition:all .18s;user-select:none;background:var(--surface)}
.pill input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700;transform:translateY(-1px)}
.pill input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.likert7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.likert7 .pill span{width:100%;padding:6px 2px;flex-direction:column;font-size:.72rem;line-height:1.15;text-align:center;border-radius:10px;min-height:52px}
.likert7 .pill b{font-family:var(--f-mono);font-size:.95rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary);flex:none}
.consent-doc{background:var(--surface-2);border-radius:12px;padding:16px 18px;max-height:none;display:grid;gap:10px;font-size:.95rem}
.consent-doc h3{font-size:.98rem}

/* ---------- presentación ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.hero-anim{aspect-ratio:1/1;max-width:340px;width:100%;justify-self:center;position:relative}
.hero-anim .lottie{position:absolute;inset:0}
.hero-anim .center-ico{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.fact{background:var(--surface-2);border-radius:12px;padding:12px}
.fact b{display:block;font-family:var(--f-display);font-size:1.35rem}
.fact span{font-size:.8rem;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:18px;padding:0;list-style:none;counter-reset:f}
.flow li{counter-increment:f;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:.86rem;display:flex;gap:8px;align-items:flex-start}
.flow li::before{content:counter(f);font-family:var(--f-mono);font-size:.75rem;background:var(--primary-soft);color:var(--primary);border-radius:6px;padding:1px 6px;flex:none}
.flow li.enc{background:var(--accent-soft);border-color:transparent}

/* ---------- NASA ---------- */
.nasa{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
.nasa-item{padding:14px;border:1.5px solid var(--line);border-radius:12px}
.nasa-item + .nasa-item{margin-top:10px}
.nasa-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.nasa-val{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;color:var(--primary);min-width:3ch;text-align:right}
.nasa-val.unset{color:var(--muted)}
.range{width:100%;margin-top:8px;accent-color:var(--primary);height:28px}
.ticks{display:flex;justify-content:space-between;margin-top:-4px;padding:0 7px}
.ticks i{width:1px;height:6px;background:var(--line)}
.ticks i:nth-child(5n+1){height:10px;background:var(--muted)}
.ends{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.radar-card{position:sticky;top:calc(var(--topbar-h) + 28px);padding:16px;text-align:center}
.radar-card svg{width:100%;max-width:300px;height:auto}
.big{font-family:var(--f-display);font-size:2.4rem;font-weight:800;line-height:1}

/* ---------- Nórdico ---------- */
.nordic{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:start}
.body-map{position:sticky;top:calc(var(--topbar-h) + 28px);padding:12px;text-align:center}
.body-map svg{width:100%;max-width:300px;height:auto}
.reg{cursor:pointer;transition:fill .25s,stroke .25s;fill:var(--surface-2);stroke:var(--muted);stroke-width:1.2}
.reg:hover{fill:var(--primary-soft)}
.reg.yes{fill:var(--accent);stroke:var(--accent)}
.reg.sel{stroke:var(--primary);stroke-width:3}
.silhouette{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.legend-row{display:flex;gap:14px;justify-content:center;font-size:.8rem;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend-row i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.region{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s,box-shadow .2s;scroll-margin-top:calc(var(--topbar-h) + 28px)}
.region + .region{margin-top:10px}
.region.sel{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.region-head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.region-body{display:grid;gap:10px;margin-top:10px}
.subq{display:grid;gap:6px}
.subq .q-label{font-weight:400;font-size:.88rem;color:var(--ink-2)}

/* ---------- REBA ---------- */
.obs-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.obs-tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px}
.obs-tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.reba{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.group{border:1.5px solid var(--line);border-radius:14px;padding:14px}
.group + .group{margin-top:12px}
.group h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:2}
.opt .box{border:1.5px solid var(--line);border-radius:12px;padding:8px 8px 6px;display:grid;gap:4px;text-align:center;transition:all .18s;background:var(--surface);height:100%}
.opt svg{width:100%;height:74px}
.opt .lbl{font-size:.76rem;line-height:1.2;color:var(--ink-2)}
.opt .pts{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.opt input:checked + .box{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px var(--primary-soft)}
.opt input:checked + .box .pts{color:var(--primary);font-weight:600}
.opt input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
.adj{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.adj label{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;border:1px dashed var(--line);border-radius:999px;padding:6px 10px;cursor:pointer}
.adj input{accent-color:var(--primary)}
.score-card{position:sticky;top:calc(var(--topbar-h) + 28px);padding:16px;display:grid;gap:12px}
.score-num{font-family:var(--f-display);font-size:3.4rem;font-weight:800;line-height:1;transition:color .3s}
.lvl{padding:6px 12px;border-radius:999px;font-weight:700;display:inline-block;font-size:.88rem}
.lvl-1{background:var(--good-soft);color:var(--good)}
.lvl-2{background:var(--seq1);color:var(--ink)}
.lvl-3{background:var(--warn-soft);color:var(--warn)}
.lvl-4{background:var(--bad-soft);color:var(--bad)}
.lvl-5{background:var(--bad);color:#fff}
.calc{font-family:var(--f-mono);font-size:.8rem;display:grid;gap:3px;color:var(--ink-2)}
.calc div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding-bottom:2px}
.photo-zone{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.thumbs figure{margin:0;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--surface-2)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}

/* ---------- resumen ---------- */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sum{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.sum b{font-family:var(--f-display);font-size:1.5rem}
.done-screen{text-align:center;display:grid;justify-items:center;gap:12px;padding:20px 0}
.done-screen .lottie{width:180px;height:180px}
.saving{display:flex;align-items:center;gap:10px;justify-content:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--primary-soft);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- admin ---------- */
.admin-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px;display:grid;gap:4px}
.kpi b{font-family:var(--f-display);font-size:2rem;line-height:1}
.kpi .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.kpi .bar i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.panel{padding:16px;min-width:0}
.panel h3{margin-bottom:4px}
.hbars{display:grid;gap:7px;margin-top:12px}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:.84rem}
.hbar .track{height:16px;background:var(--surface-2);border-radius:0 4px 4px 0;position:relative}
.hbar .fill{height:100%;border-radius:0 4px 4px 0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hbar .v{font-family:var(--f-mono);text-align:right;color:var(--ink-2)}
.hbar:hover .fill{filter:brightness(1.1)}
.vbars{display:flex;gap:10px;align-items:flex-end;height:150px;margin-top:14px;border-bottom:1px solid var(--line);padding:0 6px}
.vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.vbar .col{width:100%;max-width:46px;border-radius:4px 4px 0 0;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.vbar .n{font-family:var(--f-mono);font-size:.8rem}
.vlabels{display:flex;gap:10px;padding:6px 6px 0}
.vlabels span{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.table-wrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:760px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rebaLevel(s) {
  if (!s) return null;
  if (s === 1) return { n: 1, t: "Inapreciable", a: "No es necesaria actuación" };
  if (s <= 3) return { n: 2, t: "Bajo", a: "Puede ser necesaria la actuación" };
  if (s <= 7) return { n: 3, t: "Medio", a: "Es necesaria la actuación" };
  if (s <= 10) return { n: 4, t: "Alto", a: "Es necesaria la actuación cuanto antes" };
  return { n: 5, t: "Muy alto", a: "Es necesaria la actuación de inmediato" };
}
function rebaCalc(o) {
  if (!o) return null;
  const need = ["neck", "trunk", "legs", "load", "upper", "lower", "wrist", "coupling"];
  if (need.some(k => o[k] == null)) return null;
  const neck = clamp(o.neck + (o.neckAdj ? 1 : 0), 1, 3);
  const trunk = clamp(o.trunk + (o.trunkAdj ? 1 : 0), 1, 5);
  const legs = clamp(o.legs + (o.knee || 0), 1, 4);
  const a = TABLE_A[neck][trunk - 1][legs - 1];
  const load = o.load + (o.shock ? 1 : 0);
  const scoreA = a + load;
  const upper = clamp(o.upper + (o.abd ? 1 : 0) + (o.raised ? 1 : 0) - (o.supported ? 1 : 0), 1, 6);
  const lower = o.lower;
  const wrist = clamp(o.wrist + (o.wristAdj ? 1 : 0), 1, 3);
  const b = TABLE_B[lower][upper - 1][wrist - 1];
  const scoreB = b + o.coupling;
  const c = TABLE_C[clamp(scoreA, 1, 12) - 1][clamp(scoreB, 1, 12) - 1];
  const act = (o.act1 ? 1 : 0) + (o.act2 ? 1 : 0) + (o.act3 ? 1 : 0);
  const total = c + act;
  return { neck, trunk, legs, a, load, scoreA, upper, lower, wrist, b, coupling: o.coupling, scoreB, c, act, total, level: rebaLevel(total) };
}

const P = { db: null, assets: null, user: null, downloads: null, uid: null, ready: false, canAdmin: false };
async function initPlatform() {
  if (!window.claude || !window.claude.use) { P.ready = true; renderConn(); if (route() === "admin") Admin.start(); return; }
  const [db, user, assets, downloads] = await Promise.all(["db", "user", "assets", "downloads"].map(n => window.claude.use(n).catch(() => null)));

  if (user) { try { P.uid = await user.id(); } catch {} try { P.canAdmin = !!(user.canEdit && await user.canEdit()) || !!(user.isOwner && await user.isOwner()); } catch {} }

}

const DRAFT_KEY = "tme_borrador_v1";
function blank() {
  return { step: 0, maxStep: 0, meta: { codigo: "", estrato: "", establecimiento: "", fecha: hoy() },
    cons: { leido: false, acepta: null, foto: null },
    ficha: {}, nasa: {}, suseso: {}, warr: {}, nordic: {}, reba: { tarea: "", lado: "", obs: [{}, {}, {}], fotos: [] }, active: 0 };
}
let S = store.get(DRAFT_KEY) || blank();
let saveTimer = null;
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { if (!store.set(DRAFT_KEY, S)) toast("El borrador no cabe en este dispositivo: elimine alguna foto o envíe la encuesta."); }, 350); }
// tras enviar o registrar: vaciar el estado para que la misma encuesta no pueda enviarse dos veces
function clearDraft() { clearTimeout(saveTimer); store.del(DRAFT_KEY); S = blank(); }
const MAX_FOTOS_OBS = 3;
const USED_KEY = "tme_codigos_usados";
function randomCode(estrato) {
  const used = new Set(store.get(USED_KEY) || []);
  const a = new Uint32Array(1); let c;
  do { crypto.getRandomValues(a); c = `${estrato[0]}-${1000 + a[0] % 9000}`; } while (used.has(c));
  return c;
}
function markUsed(code) { if (!code) return; const u = store.get(USED_KEY) || []; if (!u.includes(code)) { u.push(code); store.set(USED_KEY, u); } }

/* ---------- puntajes ---------- */
function scores(st = S) {
  const n = NASA.map(x => st.nasa[x.id]).filter(v => v != null);
  const nasa = n.length === 6 ? Math.round(n.reduce((a, b) => a + b, 0) / 6 * 10) / 10 : null;
  const sus = {}; let susOk = true;
  SUSESO.forEach(d => { let s = 0; d.items.forEach(([n, , inv]) => { const v = st.suseso["s" + n]; if (v == null) susOk = false; else s += inv ? 4 - v : v; }); sus[d.key] = s; });
  const w = WARR.map((_, i) => st.warr["w" + (i + 1)]).filter(v => v != null);
  const warr = w.length === 15 ? w.reduce((a, b) => a + b, 0) : null;
  const regs = REGIONS.filter(r => st.nordic[r.id]?.m12 === "Sí").map(r => r.id);
  const reba = st.reba.obs.map(rebaCalc);
  const valid = reba.filter(Boolean).map(r => r.total);
  const rebaFinal = valid.length ? Math.max(...valid) : null;
  const imc = st.ficha.peso && st.ficha.talla ? Math.round(st.ficha.peso / ((st.ficha.talla / 100) ** 2) * 10) / 10 : null;
  return { nasa, sus: susOk ? sus : null, warr, regs, sintomas12: regs.length > 0, reba, rebaFinal, rebaLevel: rebaLevel(rebaFinal), imc };
}
function eligibility(st = S) {
  const f = st.ficha, out = [];
  if (f.reuma === "Sí") out.push("Diagnóstico de enfermedad reumatológica sistémica");
  if (f.embarazo === "Sí") out.push("Embarazo en curso");
  if (f.licencia === "Sí") out.push("Descanso médico o licencia");
  if (f.moviliza === "No") out.push("No realiza movilización o transferencia de pacientes");
  if (f.meses != null && f.meses !== "" && +f.meses < 3) out.push("Menos de 3 meses de actividad asistencial");
  if (f.condicion === "Egresado" && f.anosEgreso != null && f.anosEgreso !== "" && +f.anosEgreso > 6) out.push("Más de 6 años de egreso");
  return out;
}

function head(i, sub, chips = "") {

function nav(host, { back = true, nextLabel = "Siguiente", onNext }) {

function pills(name, opts, val) { return `<div class="pills" role="radiogroup">${opts.map(o => `<label class="pill"><input type="radio" name="${name}" value="${esc(o)}" ${val === o ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>`; }

/* ---------- 3. Ficha ---------- */
function fichaError(f = S.ficha) {
  for (const q of FICHA) {
    if (!q.id) continue; if (q.only && f.condicion !== q.only) continue;
    const v = f[q.id];
    if (v == null || v === "") return { id: q.id, msg: `Falta responder: «${q.t}».` };
    if (q.type === "number" && (v < q.min || v > q.max)) return { id: q.id, msg: `Revise el valor de «${q.t}» (entre ${q.min} y ${q.max}).` };
  }
  if (f.condicion !== S.meta.estrato) return { id: "condicion", msg: "La condición no coincide con el estrato registrado." };
  if (f.sexo === "Masculino" && f.embarazo === "Sí") return { id: "embarazo", msg: "La respuesta de embarazo no es compatible con el sexo registrado." };
  if (f.sexo === "Femenino" && f.embarazo === "No aplica") return { id: "embarazo", msg: "Indique «Sí» o «No» en la pregunta de embarazo." };
  return null;
}
function stepFicha(host) {
  const f = S.ficha;
  let html = head(2, "Datos generales, condición laboral, jornada, pausas activas y antecedentes. Son confidenciales.", `<span class="chip p">Anexo 3</span><span class="chip a">23 ítems</span>`);
  let n = 0;
  FICHA.forEach(q => {
    if (q.sec) { html += `<div class="section-title"><span class="tag">${q.sec[0]}</span><h3>${esc(q.sec.slice(3))}</h3></div>`; return; }
    n++;
    const hid = q.only && f.condicion !== q.only ? "hidden" : "";
    let ctrl = "";
    if (q.type === "number") ctrl = `<div style="display:flex;gap:8px;align-items:center;max-width:260px"><input class="input mono" type="number" inputmode="decimal" id="f-${q.id}" min="${q.min}" max="${q.max}" step="${q.step || 1}" value="${esc(f[q.id] ?? "")}"><span class="muted">${q.unit}</span></div>`;
    else if (q.type === "text") ctrl = `<input class="input" id="f-${q.id}" value="${esc(f[q.id] ?? "")}">`;
    else ctrl = pills("f-" + q.id, q.opts, f[q.id]);
    if (q.follow) ctrl += `<div id="fw-${q.id}" ${f[q.id] === "Sí" ? "" : "hidden"}><input class="input" id="f-${q.follow.id}" placeholder="${q.follow.t}" value="${esc(f[q.follow.id] ?? "")}"></div>`;
    html += `<div class="q" id="q-${q.id}" data-only="${q.only || ""}" ${hid}><div class="q-head"><span class="q-num">${String(n).padStart(2, "0")}</span><span class="q-label">${esc(q.t)}</span></div>${ctrl}</div>`;
  });
  html += `<div id="elig" style="margin-top:14px"></div>`;
  host.innerHTML = html;
  const updElig = () => { const e = eligibility(); $("#elig", host).innerHTML = e.length ? `<div class="banner bad"><div><b>Posible criterio de exclusión.</b> ${e.map(esc).join("; ")}. Si se confirma, registre al participante como no elegible para reemplazarlo dentro del mismo estrato.<div style="margin-top:8px"><button class="btn btn-accent" id="noelig" style="min-height:38px;padding:6px 14px">Registrar como no elegible</button></div></div></div>` : ""; const b = $("#noelig", host); if (b) b.onclick = () => finishRefusal("no elegible"); };
  FICHA.filter(q => q.id).forEach(q => {
    if (q.type === "pills") bindPills(host, "f-" + q.id, v => {
      f[q.id] = v;
      if (q.id === "condicion") $$("[data-only]", host).forEach(el => { if (el.dataset.only) el.hidden = el.dataset.only !== v; });
      if (q.follow) $(`#fw-${q.id}`, host).hidden = v !== "Sí";
      if (q.id === "sexo" && v === "Masculino" && f.embarazo !== "No aplica") { f.embarazo = "No aplica"; const r = $(`input[name="f-embarazo"][value="No aplica"]`, host); if (r) r.checked = true; }
      persist(); updElig();
    });
    else { const el = $(`#f-${q.id}`, host); el.oninput = () => { el.closest(".q").classList.remove("invalid"); f[q.id] = q.type === "number" ? (el.value === "" ? "" : +el.value) : el.value; persist(); updElig(); }; }
    if (q.follow) { const el = $(`#f-${q.follow.id}`, host); el.oninput = () => { f[q.follow.id] = el.value; persist(); }; }
  });
  updElig();
  nav(host, { onNext: () => {
    $$(".invalid", host).forEach(x => x.classList.remove("invalid"));
    const e = fichaError();
    if (e) { if (e.id) $(`#q-${e.id}`, host).classList.add("invalid"); return e.msg; }
    if (eligibility().length) return "El participante cumple un criterio de exclusión. Regístrelo como no elegible o corrija la respuesta.";
    return null; } });
}

/* ---------- 4. NASA-TLX ---------- */
function radarSVG(vals) {
  const cx = 150, cy = 150, R = 105, n = 6;
  const pt = (i, r) => polar(cx, cy, r, i * 360 / n);
  let g = "";
  [25, 50, 75, 100].forEach(l => { g += `<polygon points="${[...Array(n)].map((_, i) => pt(i, R * l / 100).map(v => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  NASA.forEach((x, i) => { const [ax, ay] = pt(i, R); g += `<line x1="${cx}" y1="${cy}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}" stroke="var(--line)"/>`; const [lx, ly] = pt(i, R + 22); g += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="var(--ink-2)" font-family="Atkinson Hyperlegible, sans-serif">${x.t.replace("Exigencia ", "Exig. ")}</text>`; });
  const pts = NASA.map((x, i) => pt(i, R * (vals[x.id] ?? 0) / 100));
  g += `<polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="var(--primary)" fill-opacity=".22" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach(([x, y], i) => { if (vals[NASA[i].id] != null) g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="var(--primary)" stroke="var(--surface)" stroke-width="2"/>`; });
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Perfil de carga de trabajo">${g}</svg>`;
}

  requestAnimationFrame(step);
}
// tooltip único para cualquier elemento con data-tip (ratón y toque)
(function () {
  const tip = document.createElement("div"); tip.className = "tip"; tip.setAttribute("role", "tooltip"); document.body.appendChild(tip);
  let hideT;
  const show = (el, x, y) => { tip.textContent = el.dataset.tip; tip.style.left = Math.max(70, Math.min(window.innerWidth - 70, x)) + "px"; tip.style.top = y + "px"; tip.classList.add("show"); };
  document.addEventListener("pointermove", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el && e.pointerType === "mouse") show(el, e.clientX, e.clientY); else if (e.pointerType === "mouse") tip.classList.remove("show"); });
  document.addEventListener("pointerdown", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el && e.pointerType !== "mouse") { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); clearTimeout(hideT); hideT = setTimeout(() => tip.classList.remove("show"), 1800); } });
  window.addEventListener("scroll", () => tip.classList.remove("show"), { passive: true });
})();
function estadoTxt(e) { return e ? e[0].toUpperCase() + e.slice(1) : ""; }
function emptyIco() { return `<svg viewBox="0 0 64 64" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"><rect x="10" y="8" width="44" height="50" rx="6"/><path d="M22 8v6h20V8M20 28h24M20 38h24M20 48h14"/></svg>`; }
function lightbox(src) { const lb = document.createElement("div"); lb.className = "lightbox"; lb.innerHTML = `<img src="${src}" alt="Fotografía ampliada">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); }


/* =====================================================================
   INICIO
   ===================================================================== */
const LOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
function renderHome() {

  const d = store.get(DRAFT_KEY);
  const pending = d && d.meta && d.meta.codigo && d.step > 0;
  v.innerHTML = `<div class="home">
    <div class="home-hero">

        <p class="eyebrow">Maestría en Salud Pública · UNP</p>

        <p class="lead" style="margin-top:10px">Aplicación de campo del estudio: seis instrumentos en un solo recorrido y un panel para seguir el avance de la muestra (121 participantes: 68 egresados y 53 internos de la UCSS).</p>
      </div>
      <div class="hero-anim" aria-hidden="true" style="max-width:240px"><div class="lottie" id="lot-home"></div><div class="center-ico"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="4" r="2"/><path d="M12 6.5v7.5M12 8.5l-4.5 3M12 8.5l4.5 3M12 14l-3.2 6.5M12 14l3.2 6.5"/></svg></div></div>
    </div>
    ${pending ? `<div class="card resume"><div><b>Encuesta en curso en este dispositivo</b><br><span class="muted">Código <span class="mono">${esc(d.meta.codigo)}</span> · paso ${d.step + 1} de ${STEPS.length} (${esc(STEPS[d.step].t)})</span></div><div class="toolbar" id="resume-act"><button class="btn btn-ghost" id="del-draft">Eliminar</button><a class="btn btn-primary" href="#encuesta">Continuar ${ICONS.next}</a></div></div>` : ""}
    <div class="choices">
      <a class="card choice enc" href="#encuesta">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3M9 10h6M9 14h6M9 18h3"/></svg></span>
        <div><p class="eyebrow">Encuestadores</p><h2>Aplicar encuesta</h2></div>
        <ul><li>Presentación y consentimiento informado</li><li>Ficha, NASA-TLX, SUSESO/ISTAS21, satisfacción laboral y Nórdico</li><li>Observación REBA con diagramas y fotos opcionales</li></ul>

        <div><p class="eyebrow">Investigador y asesora</p><h2>Panel de administración</h2></div>

  playLottie($("#lot-home", v), lottieRings(cssVar("--primary")), true);

/* =====================================================================
   ACCESO AL PANEL (contraseña)
   ===================================================================== */
const SESSION_KEY = "tme_admin_sesion";
const ses = {
  get() { try { return sessionStorage.getItem(SESSION_KEY); } catch { return null; } },
  set(v) { try { sessionStorage.setItem(SESSION_KEY, v); } catch {} },
  del() { try { sessionStorage.removeItem(SESSION_KEY); } catch {} }
};
async function hashPass(pw, salt, iter = 150000) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(salt), iterations: iter, hash: "SHA-256" }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function randomSalt() { const a = new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, "0")).join(""); }
const Gate = {
  cfg: null,
  async load() { try { const d = await P.db.doc("config/admin").get(); this.cfg = d.exists ? d.data() : null; } catch { this.cfg = undefined; } return this.cfg; },
  ok() { const t = ses.get(); return !!(t && this.cfg && this.cfg.hash && t === this.cfg.hash.slice(0, 16)); },
  async show() {
    const v = $("#view-adm");
    v.innerHTML = `<div class="card login"><div class="saving"><span class="spin"></span>Verificando acceso…</div></div>`;
    await this.load();
    if (this.cfg === undefined) { v.innerHTML = `<div class="card login"><span class="ico">${LOCK}</span><h2>Sin conexión</h2><p class="muted" style="text-align:center">No se pudo verificar la contraseña. Revise la conexión y vuelva a intentarlo.</p><button class="btn btn-primary" id="g-retry">Reintentar</button></div>`; $("#g-retry").onclick = () => this.show(); return; }
    if (this.ok()) { Admin.unlocked = true; Admin.start(); return; }
    if (!this.cfg || !this.cfg.hash || !this.cfg.salt) {
      if (!P.canAdmin) { v.innerHTML = `<div class="card login"><span class="ico">${LOCK}</span><h2>Panel no configurado</h2><p class="muted" style="text-align:center">El investigador aún no ha creado la contraseña del panel. Para aplicar encuestas use la opción «Aplicar encuesta».</p><a class="btn btn-ghost" href="#inicio">Volver al inicio</a></div>`; return; }
      v.innerHTML = `<form class="card login" id="g-form" autocomplete="off"><span class="ico">${LOCK}</span><h2>Crear contraseña del panel</h2><p class="muted" style="text-align:center">Es la primera vez que se abre el panel. Defina una contraseña de al menos 8 caracteres y compártala solo con quien deba ver los resultados.</p>
        <div class="field"><label for="g-p1">Nueva contraseña</label><div class="pw"><input class="input" type="password" id="g-p1" minlength="8" autocomplete="new-password"><button type="button" data-eye="g-p1">Ver</button></div></div>
        <div class="field"><label for="g-p2">Repita la contraseña</label><div class="pw"><input class="input" type="password" id="g-p2" autocomplete="new-password"><button type="button" data-eye="g-p2">Ver</button></div></div>
        <p class="err" id="g-err" role="alert"></p><button class="btn btn-accent" type="submit">Guardar y entrar</button><a class="btn btn-ghost" href="#inicio">Cancelar</a></form>`;
      this.eyes(v);
      $("#g-form").onsubmit = async e => { e.preventDefault(); const a = $("#g-p1").value, b = $("#g-p2").value, err = $("#g-err");
        if (a.length < 8) { err.textContent = "La contraseña debe tener al menos 8 caracteres."; return; }
        if (a !== b) { err.textContent = "Las contraseñas no coinciden."; return; }
        err.textContent = ""; const salt = randomSalt(); const hash = await hashPass(a, salt);
        try { await P.db.doc("config/admin").set({ salt, hash, iter: 150000, actualizado: new Date().toISOString() }); this.cfg = { salt, hash }; ses.set(hash.slice(0, 16)); Admin.unlocked = true; toast("Contraseña creada"); Admin.start(); }
        catch { err.textContent = "No se pudo guardar. Solo el propietario o un editor del estudio puede crear la contraseña."; } };
      return;
    }
    v.innerHTML = `<form class="card login" id="g-form" autocomplete="off"><span class="ico">${LOCK}</span><h2>Panel de administración</h2><p class="muted" style="text-align:center">Ingrese la contraseña del panel para ver el avance, las fotografías y exportar los datos.</p>
      <div class="field"><label for="g-p">Contraseña</label><div class="pw"><input class="input" type="password" id="g-p" autocomplete="current-password"><button type="button" data-eye="g-p">Ver</button></div></div>
      <p class="err" id="g-err" role="alert"></p><button class="btn btn-accent" type="submit">Ingresar</button><a class="btn btn-ghost" href="#inicio">Volver al inicio</a></form>`;
    this.eyes(v); setTimeout(() => $("#g-p")?.focus(), 50);
    $("#g-form").onsubmit = async e => { e.preventDefault(); const pw = $("#g-p").value, err = $("#g-err"), f = $("#g-form");
      if (!pw) { err.textContent = "Escriba la contraseña."; return; }
      err.textContent = "Verificando…";
      const h = await hashPass(pw, this.cfg.salt, this.cfg.iter || 150000);
      if (h === this.cfg.hash) { ses.set(h.slice(0, 16)); Admin.unlocked = true; toast("Acceso concedido"); Admin.start(); }
      else { err.textContent = "Contraseña incorrecta. Inténtelo de nuevo."; f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); $("#g-p").select(); } };
  },
  eyes(v) { $$("[data-eye]", v).forEach(b => b.onclick = () => { const i = $("#" + b.dataset.eye); i.type = i.type === "password" ? "text" : "password"; b.textContent = i.type === "password" ? "Ver" : "Ocultar"; }); },
  async change() {
    const box = $("#pw-change"); if (!box) return;
    box.hidden = !box.hidden; if (box.hidden) return;
    box.innerHTML = `<div class="grid3" style="align-items:end"><div class="field"><label for="c-p1">Nueva contraseña</label><input class="input" type="password" id="c-p1" autocomplete="new-password"></div><div class="field"><label for="c-p2">Repita la contraseña</label><input class="input" type="password" id="c-p2" autocomplete="new-password"></div><button class="btn btn-accent" id="c-save">Guardar contraseña</button></div><p class="err" id="c-err"></p>`;
    $("#c-save").onclick = async () => { const a = $("#c-p1").value, b = $("#c-p2").value, err = $("#c-err");
      if (a.length < 8) { err.textContent = "Al menos 8 caracteres."; return; } if (a !== b) { err.textContent = "Las contraseñas no coinciden."; return; }
      const salt = randomSalt(), hash = await hashPass(a, salt);
      try { await P.db.doc("config/admin").set({ salt, hash, iter: 150000, actualizado: new Date().toISOString() }); this.cfg = { salt, hash }; ses.set(hash.slice(0, 16)); box.hidden = true; toast("Contraseña actualizada"); }
      catch { err.textContent = "No se pudo guardar. Solo el propietario o un editor puede cambiarla."; } };
  },
  logout() { ses.del(); Admin.unlocked = false; Admin.subs.forEach(u => { try { u(); } catch {} }); Admin.subs = []; Admin.data = new Map(); Admin.started = false; location.hash = "#inicio"; toast("Sesión de administración cerrada"); }
};

/* =====================================================================
   RUTAS
   ===================================================================== */
function route() { return location.hash === "#admin" ? "admin" : location.hash === "#encuesta" ? "encuesta" : "inicio"; }
function applyRoute() {
  const r = route();
  $("#view-home").hidden = r !== "inicio"; $("#view-enc").hidden = r !== "encuesta"; $("#view-adm").hidden = r !== "admin";
  $("#tab-home").setAttribute("aria-current", r === "inicio" ? "page" : "false");
  $("#tab-enc").setAttribute("aria-current", r === "encuesta" ? "page" : "false");
  $("#tab-adm").setAttribute("aria-current", r === "admin" ? "page" : "false");
  if (r === "admin") Admin.start(); else if (r === "encuesta") { S = store.get(DRAFT_KEY) || S; renderSurvey(); } else renderHome();
  window.scrollTo({ top: 0 });
}
function syncTopbar() { const t = $(".topbar"); if (t) document.documentElement.style.setProperty("--topbar-h", t.offsetHeight + "px"); }
if (window.ResizeObserver) new ResizeObserver(syncTopbar).observe($(".topbar")); else window.addEventListener("resize", syncTopbar);
syncTopbar();
window.addEventListener("hashchange", applyRoute);
applyRoute();
initPlatform();
