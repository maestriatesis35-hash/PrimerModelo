<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudio TME Fisioterapia</title>
<meta name="description" content="Aplicación de campo del estudio de síntomas musculoesqueléticos en fisioterapeutas (UCSS 2026).">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<meta name="theme-color" content="#E11D48">
</head>
<body>
<style>
/* Layout: cuaderno de campo clínico — barra superior con dos vistas; encuesta en pasos con riel de progreso; panel en rejilla de tarjetas */
:root{
  --bg:#FFF7F5; --surface:#FFFFFF; --surface-2:#FFF0F2; --ink:#1F1A1C; --ink-2:#4A4245; --muted:#78716C;
  --line:#F8DFE3; --primary:#E11D48; --primary-ink:#FFFFFF; --primary-soft:#FFE8EC;
  --accent:#0D9488; --accent-soft:#CCFBF1;
  --good:#16A34A; --good-soft:#DDF5E8; --warn:#B45309; --warn-soft:#FFDDB8; --bad:#DC2626; --bad-soft:#FDE3E1;
  --s1:#FF3D63; --s2:#2DD4BF;
  --seq1:#FFE8EC; --seq2:#FFC2CC; --seq3:#FF8B9C; --seq4:#F2335A; --seq5:#BE123C;
  --grad:linear-gradient(135deg,#FFE8EC 0%,#FFF0F2 55%,#FFF3E4 100%);
  --shadow:0 1px 2px rgba(41,37,36,.05),0 8px 24px rgba(41,37,36,.06);
  --shadow-lg:0 2px 4px rgba(41,37,36,.05),0 18px 40px rgba(225,29,72,.14);
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px; --r-sm:9px; --topbar-h:60px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.3rem,3vw,1.7rem);font-weight:700;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;letter-spacing:.01em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;flex:none}
.brand-mark svg{width:22px;height:22px}
.brand b{font-family:var(--f-display);font-size:1.02rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem}
.tabs{margin-left:auto;display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.tabs a{text-decoration:none;color:var(--ink-2);padding:7px 14px;border-radius:999px;font-weight:700;font-size:.9rem;transition:background .2s,color .2s}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 80px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r-sm);font-size:.9rem;margin-bottom:14px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner.good{background:var(--good-soft);border-color:transparent}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;transition:transform .15s ease,box-shadow .2s,background .2s;min-height:44px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#FF3D63,#E11D48);color:var(--primary-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 35%,transparent)}
.btn-primary:hover{box-shadow:0 8px 22px color-mix(in srgb,var(--primary) 45%,transparent)}
.btn-ghost{background:var(--surface);color:var(--ink-2);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);transform:translateY(-1px)}
.btn-accent{background:linear-gradient(135deg,#2DD4BF,#0D9488);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}

/* ---------- encuesta: layout ---------- */
.survey{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.rail{position:sticky;top:calc(var(--topbar-h) + 22px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail li button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px;cursor:pointer;font-size:.92rem;color:var(--ink-2)}
.rail li button:hover{background:var(--surface-2)}
.rail li button[aria-current="step"]{background:var(--primary-soft);color:var(--ink);font-weight:700}
.rail .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;border:1.5px solid var(--line);background:var(--surface);transition:all .25s}
.rail li.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.rail li button[aria-current="step"] .dot{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.rail .who{font-size:.72rem;color:var(--muted);display:block;line-height:1.2}
.rail-foot{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:.82rem;color:var(--muted)}
.mobile-progress{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.step{padding:clamp(18px,3vw,30px);animation:stepIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes stepIn{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
.step-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.step-head .meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.chip.p{background:var(--primary-soft);color:var(--primary)}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.chip.g{background:var(--good-soft);color:var(--good)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.b{background:var(--bad-soft);color:var(--bad)}
.lead{color:var(--ink-2);max-width:68ch}
.navbar{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.err{color:var(--bad);font-size:.85rem;font-weight:700;min-height:1.2em}

/* ---------- formularios ---------- */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.q-label{font-weight:700;font-size:.93rem}
.field small{color:var(--muted);font-size:.8rem}
.input,select.input,textarea.input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px;transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.input.invalid,.q.invalid{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}
.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.section-title .tag{font-family:var(--f-mono);font-size:.78rem;background:var(--ink);color:var(--surface);padding:2px 8px;border-radius:6px}
.q{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;background:var(--surface);transition:border-color .2s}
.q + .q{margin-top:10px}
.q-head{display:flex;gap:10px;align-items:baseline}
.q-num{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);min-width:2.2em}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;cursor:pointer}
.pill span{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);font-size:.88rem;cursor:pointer;transition:all .18s;user-select:none;background:var(--surface)}
.pill input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700;transform:translateY(-1px)}
.pill input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.likert7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.likert7 .pill span{width:100%;padding:6px 2px;flex-direction:column;font-size:.72rem;line-height:1.15;text-align:center;border-radius:10px;min-height:52px}
.likert7 .pill b{font-family:var(--f-mono);font-size:.95rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary);flex:none}
.consent-doc{background:var(--surface-2);border-radius:12px;padding:16px 18px;max-height:none;display:grid;gap:10px;font-size:.95rem}
.consent-doc h3{font-size:.98rem}

/* ---------- presentación ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.hero-anim{aspect-ratio:1/1;max-width:340px;width:100%;justify-self:center;position:relative}
.hero-anim .lottie{position:absolute;inset:0}
.hero-anim .center-ico{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.fact{background:var(--surface-2);border-radius:12px;padding:12px}
.fact b{display:block;font-family:var(--f-display);font-size:1.35rem}
.fact span{font-size:.8rem;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:18px;padding:0;list-style:none;counter-reset:f}
.flow li{counter-increment:f;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:.86rem;display:flex;gap:8px;align-items:flex-start}
.flow li::before{content:counter(f);font-family:var(--f-mono);font-size:.75rem;background:var(--primary-soft);color:var(--primary);border-radius:6px;padding:1px 6px;flex:none}
.flow li.enc{background:var(--accent-soft);border-color:transparent}

/* ---------- NASA ---------- */
.nasa{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
.nasa-item{padding:14px;border:1.5px solid var(--line);border-radius:12px}
.nasa-item + .nasa-item{margin-top:10px}
.nasa-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.nasa-val{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;color:var(--primary);min-width:3ch;text-align:right}
.nasa-val.unset{color:var(--muted)}
.range{width:100%;margin-top:8px;accent-color:var(--primary);height:28px}
.ticks{display:flex;justify-content:space-between;margin-top:-4px;padding:0 7px}
.ticks i{width:1px;height:6px;background:var(--line)}
.ticks i:nth-child(5n+1){height:10px;background:var(--muted)}
.ends{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.radar-card{position:sticky;top:calc(var(--topbar-h) + 28px);padding:16px;text-align:center}
.radar-card svg{width:100%;max-width:300px;height:auto}
.big{font-family:var(--f-display);font-size:2.4rem;font-weight:800;line-height:1}

/* ---------- Nórdico ---------- */
.nordic{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:start}
.body-map{position:sticky;top:calc(var(--topbar-h) + 28px);padding:12px;text-align:center}
.body-map svg{width:100%;max-width:300px;height:auto}
.reg{cursor:pointer;transition:fill .25s,stroke .25s;fill:var(--surface-2);stroke:var(--muted);stroke-width:1.2}
.reg:hover{fill:var(--primary-soft)}
.reg.yes{fill:var(--accent);stroke:var(--accent)}
.reg.sel{stroke:var(--primary);stroke-width:3}
.silhouette{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.legend-row{display:flex;gap:14px;justify-content:center;font-size:.8rem;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend-row i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.region{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s,box-shadow .2s;scroll-margin-top:calc(var(--topbar-h) + 28px)}
.region + .region{margin-top:10px}
.region.sel{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.region-head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.region-body{display:grid;gap:10px;margin-top:10px}
.subq{display:grid;gap:6px}
.subq .q-label{font-weight:400;font-size:.88rem;color:var(--ink-2)}

/* ---------- REBA ---------- */
.obs-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.obs-tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px}
.obs-tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.reba{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.group{border:1.5px solid var(--line);border-radius:14px;padding:14px}
.group + .group{margin-top:12px}
.group h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:2}
.opt .box{border:1.5px solid var(--line);border-radius:12px;padding:8px 8px 6px;display:grid;gap:4px;text-align:center;transition:all .18s;background:var(--surface);height:100%}
.opt svg{width:100%;height:74px}
.opt .lbl{font-size:.76rem;line-height:1.2;color:var(--ink-2)}
.opt .pts{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.opt input:checked + .box{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px var(--primary-soft)}
.opt input:checked + .box .pts{color:var(--primary);font-weight:600}
.opt input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
.adj{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.adj label{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;border:1px dashed var(--line);border-radius:999px;padding:6px 10px;cursor:pointer}
.adj input{accent-color:var(--primary)}
.score-card{position:sticky;top:calc(var(--topbar-h) + 28px);padding:16px;display:grid;gap:12px}
.score-num{font-family:var(--f-display);font-size:3.4rem;font-weight:800;line-height:1;transition:color .3s}
.lvl{padding:6px 12px;border-radius:999px;font-weight:700;display:inline-block;font-size:.88rem}
.lvl-1{background:var(--good-soft);color:var(--good)}
.lvl-2{background:var(--seq1);color:var(--ink)}
.lvl-3{background:var(--warn-soft);color:var(--warn)}
.lvl-4{background:var(--bad-soft);color:var(--bad)}
.lvl-5{background:var(--bad);color:#fff}
.calc{font-family:var(--f-mono);font-size:.8rem;display:grid;gap:3px;color:var(--ink-2)}
.calc div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding-bottom:2px}
.photo-zone{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.thumbs figure{margin:0;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--surface-2)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}

/* ---------- resumen ---------- */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sum{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.sum b{font-family:var(--f-display);font-size:1.5rem}
.done-screen{text-align:center;display:grid;justify-items:center;gap:12px;padding:20px 0}
.done-screen .lottie{width:180px;height:180px}
.saving{display:flex;align-items:center;gap:10px;justify-content:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--primary-soft);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- admin ---------- */
.admin-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px;display:grid;gap:4px}
.kpi b{font-family:var(--f-display);font-size:2rem;line-height:1}
.kpi .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.kpi .bar i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.panel{padding:16px;min-width:0}
.panel h3{margin-bottom:4px}
.hbars{display:grid;gap:7px;margin-top:12px}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:.84rem}
.hbar .track{height:16px;background:var(--surface-2);border-radius:0 4px 4px 0;position:relative}
.hbar .fill{height:100%;border-radius:0 4px 4px 0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hbar .v{font-family:var(--f-mono);text-align:right;color:var(--ink-2)}
.hbar:hover .fill{filter:brightness(1.1)}
.vbars{display:flex;gap:10px;align-items:flex-end;height:150px;margin-top:14px;border-bottom:1px solid var(--line);padding:0 6px}
.vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.vbar .col{width:100%;max-width:46px;border-radius:4px 4px 0 0;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.vbar .n{font-family:var(--f-mono);font-size:.8rem}
.vlabels{display:flex;gap:10px;padding:6px 6px 0}
.vlabels span{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.table-wrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:760px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--surface-2)}

/* ---------- panel renovado ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes growX{from{width:0}}
@keyframes growY{from{height:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.noanim .anim,.noanim .grow .fill,.noanim .grow .bar i,.noanim .grow .col{animation:none}
.anim{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.grow .fill,.grow .bar i{animation:growX .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 40ms + 150ms)}
.grow .col{animation:growY .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 25ms + 150ms)}
.adm-hero{background:var(--grad);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;position:relative;overflow:hidden}

.ring{position:relative;width:150px;height:150px;justify-self:center}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .trk{stroke:rgba(255,255,255,.85)}
.ring .val{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;align-content:center}
.ring .lbl b{font-family:var(--f-display);font-size:2rem;line-height:1}
.ring .lbl>span{font-size:.8rem;color:var(--ink-2)}
.adm-hero .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.9);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}

.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;margin-top:14px;position:sticky;top:calc(var(--topbar-h) + 8px);z-index:15;background:rgba(255,255,255,.92);backdrop-filter:blur(10px)}

.seg button:hover{color:var(--primary)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary);box-shadow:0 2px 8px rgba(225,29,72,.18)}
.seg .n{font-family:var(--f-mono);font-size:.72rem;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:1px 7px}
.search{position:relative;flex:1 1 180px;min-width:160px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:36px;min-height:40px;border-radius:999px}

.fnote{font-size:.82rem;color:var(--muted);width:100%}
.panel{transition:box-shadow .25s,transform .25s cubic-bezier(.2,.8,.2,1)}

.days .col{width:100%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--seq3),var(--seq5));transition:filter .2s,transform .2s;transform-origin:bottom}

.hbar:hover{background:var(--surface-2)}

tbody tr{transition:background .15s,transform .15s}

th{font-size:.86rem;padding:12px}
td{padding:12px;font-size:.92rem}
.gallery figcaption{font-size:.84rem}
.kv{font-size:.95rem;gap:8px 14px}
.toast{font-size:.95rem;padding:12px 20px}
.tip{font-size:.86rem;padding:8px 12px}
@media (max-width: 560px){
  .tabs a{padding:10px 12px;font-size:.92rem}
  .btn{padding:12px 18px}
  .adm-actions{gap:10px}
  .adm-actions .btn{padding:10px 12px}
  .pill span{padding:10px 16px}
  .likert7{gap:4px}
  .likert7 .pill span{min-height:48px;font-size:0}
  .likert7 .pill b{font-size:1.05rem}
  .seg button{padding:10px 14px;font-size:.9rem}
  .kpi .eyebrow{font-size:.8rem}
  .table-wrap tr{gap:10px 12px;padding:14px}

  .table-wrap td::before{font-size:.8rem;margin-bottom:2px}
  .fact span{font-size:.8rem}
  .flow li{font-size:.86rem}
  .score-card{padding:12px 16px}
}

/* ---------- consentimiento: aceptar o no ---------- */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cchoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cchoice{position:relative;cursor:pointer}
.cchoice input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.cc-box{display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s,background .25s}
.cchoice:hover .cc-box{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.cchoice.yes:hover .cc-box{border-color:#7FD3A8}
.cchoice.no:hover .cc-box{border-color:#F2A9A3}
.cc-ico{position:relative;flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:background .25s,color .25s,transform .25s}
.cc-ico svg{width:26px;height:26px}
.cchoice.yes .cc-ico{background:var(--good-soft);color:var(--good)}
.cchoice.no .cc-ico{background:var(--bad-soft);color:var(--bad)}
.cc-txt{display:grid;gap:2px;line-height:1.3}
.cc-txt b{font-size:1.08rem}
.cc-txt small{font-size:.88rem;color:var(--muted)}
.cchoice input:focus-visible + .cc-box{outline:3px solid var(--accent);outline-offset:3px}
.cchoice.yes input:checked + .cc-box{border-color:var(--good);background:linear-gradient(135deg,#E6F8EE,#D3F2E2);box-shadow:0 10px 26px rgba(22,163,74,.22)}
.cchoice.yes input:checked + .cc-box .cc-ico{background:var(--good);color:#fff}
.cchoice.no input:checked + .cc-box{border-color:var(--bad);background:linear-gradient(135deg,#FFF0EE,#FDE3E1);box-shadow:0 10px 26px rgba(220,38,38,.16)}
.cchoice.no input:checked + .cc-box .cc-ico{background:var(--bad);color:#fff}
.cchoice input:checked + .cc-box .cc-txt small{color:var(--ink-2)}
.cchoice.fx .cc-box{animation:ccPop .5s cubic-bezier(.2,.8,.2,1)}
.cchoice.fx .cc-ico{animation:ccIco .6s cubic-bezier(.2,.8,.2,1)}
.cchoice.no.fx .cc-ico{animation:ccShake .5s ease}
@keyframes ccPop{0%{transform:scale(1)}35%{transform:scale(.96)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes ccIco{0%{transform:scale(.4) rotate(-20deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:none}}
@keyframes ccShake{0%,100%{transform:none}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;opacity:0}
.cchoice.yes .burst i:nth-child(odd){background:#3CC27E}
.cchoice.yes .burst i:nth-child(even){background:#86F2E4}
.cchoice.yes.fx .burst i{animation:ccBurst .7s ease-out both}
.burst i:nth-child(1){--a:0deg}.burst i:nth-child(2){--a:45deg}.burst i:nth-child(3){--a:90deg}.burst i:nth-child(4){--a:135deg}
.burst i:nth-child(5){--a:180deg}.burst i:nth-child(6){--a:225deg}.burst i:nth-child(7){--a:270deg}.burst i:nth-child(8){--a:315deg}
@keyframes ccBurst{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-38px) scale(.4)}}
.cmsg{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:14px;font-size:.95rem;line-height:1.45;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.cmsg.yes{background:var(--good-soft);color:#14573A}
.cmsg.no{background:var(--surface-2);color:var(--ink-2)}
.cmsg-ico{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff}
.cmsg-ico svg{width:20px;height:20px}
.cmsg.yes .cmsg-ico{color:#E0566B;animation:beat 1.4s ease-in-out .4s 2}
.cmsg.no .cmsg-ico{color:var(--muted)}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.2)}40%{transform:scale(1)}60%{transform:scale(1.12)}}
@media (max-width: 560px){
  .cchoices{gap:8px}
  .cc-box{flex-direction:column;text-align:center;gap:8px;padding:14px 10px;min-height:0}
  .cc-txt b{font-size:1rem}
  .cc-txt small{font-size:.82rem}
}

/* ---------- criterios de inclusión y exclusión ---------- */
.crit{display:flex;gap:8px;align-items:flex-start;margin:6px 0 8px;padding:8px 12px;border-radius:12px;font-size:.88rem;line-height:1.4}
.crit .ms{font-size:20px;margin-top:-1px}
.crit.inc{background:#E6FBF6;color:#0F5F58}.crit.inc .ms{color:#0D9488}
.crit.exc{background:#FFEDF1;color:#9F1239}.crit.exc .ms{color:#E11D48}
.q.crit-inc{border-left:4px solid #2DD4BF}.q.crit-exc{border-left:4px solid #FB7185}
.banner ul{margin:4px 0 0;padding-left:18px}
/* ---------- modo audio: escuchar y responder con la voz ---------- */
.aud{display:inline-flex;gap:8px;margin:8px 0 4px;flex-wrap:wrap}
.q-head .aud{margin:0 0 0 auto;flex:none;flex-wrap:nowrap}
.aud button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:.88rem;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.aud button .ms{font-size:20px}
.aud .a-say{color:var(--accent);border-color:rgba(13,148,136,.35)}
.aud .a-say:hover{background:var(--accent-soft)}
.aud .a-mic{color:var(--primary);border-color:rgba(225,29,72,.3)}
.aud .a-mic:hover{background:var(--primary-soft)}
.aud button.on{color:#fff;background:var(--primary);border-color:var(--primary);animation:micPulse 1.2s ease-in-out infinite}
.aud .a-say.on{background:var(--accent);border-color:var(--accent);animation:none}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.45)}50%{box-shadow:0 0 0 10px rgba(225,29,72,0)}}
.aud-heard{flex-basis:100%;font-size:.86rem;color:var(--muted)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:640px){ .aud button span.t{display:none} .aud button{padding:0;width:44px;justify-content:center} }
@media (prefers-reduced-motion:reduce){ .aud button.on{animation:none} }

/* ---------- identidad visual TME ----------
   Paleta tomada de Ejemplo.html: coral como color principal, verde azulado como acento,
   ámbar para avisos, fondo crema y tinta color piedra. Se mantienen Manrope, los iconos
   Material Symbols y el motivo de vértebras. */
:root{
  --bg:#FFF7F5; --surface:#FFFFFF; --surface-2:#FFF0F2; --ink:#1F1A1C; --ink-2:#4A4245; --muted:#6E6468;
  --line:#F8DFE3; --primary:#E11D48; --primary-ink:#FFFFFF; --primary-soft:#FFE1E8;
  --accent:#0D9488; --accent-soft:#C9F7EE; --amber:#C2410C; --amber-soft:#FFE6C7;
  --violet:#7C3AED; --violet-soft:#EDE5FF; --green:#15A34A; --green-soft:#D6F8E1;
  --good:#15A34A; --good-soft:#D6F8E1; --warn:#B45309; --warn-soft:#FFEDC2; --bad:#DC2626; --bad-soft:#FFE0E0;
  --s1:#FF3D63; --s2:#00B3A1;
  --seq1:#FFE1E8; --seq2:#FFA3B7; --seq3:#FF6585; --seq4:#F2335A; --seq5:#BE123C;
  --grad:linear-gradient(135deg,#FFE1E8 0%,#FFF4E5 50%,#D9FBF4 100%);
  --shadow:0 1px 2px rgba(31,26,28,.05),0 8px 24px rgba(225,29,72,.07);
  --shadow-lg:0 2px 4px rgba(31,26,28,.05),0 18px 40px rgba(225,29,72,.18);
  --r:20px; --r-sm:12px;
}
body{background:radial-gradient(900px 480px at 0% -10%,rgba(255,61,99,.10),transparent 70%),radial-gradient(800px 460px at 100% 0%,rgba(0,179,161,.10),transparent 70%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-weight:800}
h1{letter-spacing:-.025em}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;width:1em;overflow:hidden;flex:none;vertical-align:middle;user-select:none}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.no-ms .ms{visibility:hidden;width:0}
.btn .ms{font-size:20px}
/* barra superior con línea de color */
.topbar{background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
.topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#FF3D63,#FF8A3D 50%,#00B3A1)}
.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#FF6B81 0%,#FF3D63 45%,#E11D48 100%);box-shadow:0 6px 18px rgba(225,29,72,.38)}
.brand-mark .ms{color:#fff;font-size:26px}
.brand b{font-size:1.1rem;letter-spacing:-.01em}
.tabs{background:var(--surface-2);border:1px solid var(--line)}
.tabs a .ms{font-size:19px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--primary);box-shadow:0 4px 14px rgba(225,29,72,.14)}
.card{border-radius:var(--r);border-color:var(--line)}
.btn{border-radius:14px}
.btn-primary{background:linear-gradient(135deg,#FF6B81 0%,#FF3D63 45%,#E11D48 100%);box-shadow:0 8px 22px rgba(225,29,72,.34)}
.btn-primary:hover{box-shadow:0 12px 28px rgba(225,29,72,.44)}
.btn-accent{background:linear-gradient(135deg,#2DD4BF,#0D9488);box-shadow:0 8px 22px rgba(13,148,136,.32)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--primary-soft);border-color:var(--seq2);color:var(--primary)}
.input,select.input,textarea.input{border-radius:12px;border-color:var(--line);background:#fff}
.input:focus{border-color:var(--seq4);box-shadow:0 0 0 4px var(--primary-soft)}
.pill span{background:#fff;border-color:var(--line);border-radius:12px}
.pill input:checked + span{background:var(--primary);border-color:var(--primary);box-shadow:0 6px 14px rgba(225,29,72,.22)}
.likert7 .pill span{border-radius:12px}
.q{background:#fff;border-color:var(--line);border-radius:16px;border-left:4px solid var(--seq1)}
.q.invalid{border-left-color:var(--bad)}
.check{border-color:var(--line);border-radius:14px;background:#fff}
.consent-doc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--seq3);border-radius:16px}
.chip.code{background:var(--primary-soft);color:var(--primary);font-size:.86rem;letter-spacing:.03em}
.section-title .tag{background:var(--primary-soft);color:var(--primary);font-family:var(--f-body);font-weight:800;border-radius:10px;min-width:34px;height:34px;display:inline-grid;place-items:center;padding:0 8px}
.section-title .tag .ms{font-size:20px}
/* cuadros de icono */
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.tile .ms{font-size:24px}
.t-accent{background:linear-gradient(145deg,#E0FCF6,var(--accent-soft));color:var(--accent);box-shadow:inset 0 0 0 1px rgba(13,148,136,.18)}
.t-primary{background:linear-gradient(145deg,#FFF0F3,var(--primary-soft));color:var(--primary);box-shadow:inset 0 0 0 1px rgba(225,29,72,.16)}
.t-amber{background:linear-gradient(145deg,#FFF4E3,var(--amber-soft));color:#EA580C;box-shadow:inset 0 0 0 1px rgba(234,88,12,.18)}
.t-violet{background:linear-gradient(145deg,#F5F0FF,var(--violet-soft));color:var(--violet);box-shadow:inset 0 0 0 1px rgba(124,58,237,.16)}
.t-green{background:linear-gradient(145deg,#ECFDF2,var(--green-soft));color:var(--green);box-shadow:inset 0 0 0 1px rgba(21,163,74,.18)}
/* inicio */
.home{gap:18px}
.home-intro{display:grid;gap:10px;max-width:860px}
.kicker{display:inline-flex;align-items:center;gap:8px;color:var(--primary);font-weight:800;font-size:.92rem}
.kicker .ms{font-size:20px;background:var(--primary-soft);border-radius:8px;padding:3px;width:auto}
.home-intro h1{font-size:clamp(1.7rem,4.4vw,2.7rem);line-height:1.14}
.home-intro h1 mark{background:linear-gradient(transparent 62%,rgba(45,212,191,.45) 62%,rgba(45,212,191,.45) 92%,transparent 92%);color:inherit;padding:0 2px}
.ctas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cta{display:grid;grid-template-rows:auto 1fr;border-radius:22px;overflow:hidden;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.cta:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.cta-top{position:relative;height:116px;overflow:hidden}
.cta-enc .cta-top{background:linear-gradient(135deg,#FF6B81 0%,#FF3D63 45%,#E11D48 100%)}
.cta-adm .cta-top{background:linear-gradient(135deg,#2DD4BF 0%,#0D9488 55%,#0F766E 100%)}
.vert{position:absolute;left:22px;top:14px;bottom:14px;display:flex;flex-direction:column;justify-content:space-between}
.vert i{display:block;width:30px;height:7px;border-radius:4px;background:rgba(255,255,255,.28)}
.vert i:nth-child(n+4){width:34px}.vert i:nth-child(n+7){width:38px;background:rgba(255,255,255,.36)}
.cta-adm .vert i:nth-child(n+7){background:#FFD166}
.cta-anim{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:120px;height:120px;pointer-events:none}
.cta-anim .lottie{position:absolute;inset:0;opacity:.7}
.cta-anim .ms{position:absolute;inset:0;margin:auto;width:1em;height:1em;font-size:46px;color:#fff;font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 48}
.cta-big{position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:70px!important;color:rgba(255,255,255,.85)}
.cta-lock{position:absolute;top:12px;left:72px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);color:#fff;padding:5px 11px;border-radius:999px;font-size:.82rem;font-weight:700}
.cta-lock .ms{font-size:16px}
.cta-body{display:grid;gap:8px;align-content:start;padding:18px 20px 20px}
.cta-tag{font-size:.84rem;font-weight:700;color:var(--muted)}
.cta h2{font-size:1.45rem}
.cta p{color:var(--ink-2);font-size:.96rem}
.cta-go{justify-self:start;display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:800;color:var(--primary);padding:10px 16px;border-radius:12px;background:var(--primary-soft);transition:background .2s}
.cta-enc .cta-go{color:#fff;background:linear-gradient(135deg,#FF6B81,#E11D48);box-shadow:0 8px 20px rgba(225,29,72,.32)}
.cta-adm .cta-go{color:#fff;background:linear-gradient(135deg,#2DD4BF,#0D9488);box-shadow:0 8px 20px rgba(13,148,136,.3)}
.fact:nth-child(1){background:linear-gradient(145deg,#FFF0F3,#FFE1E8)}.fact:nth-child(1) b{color:#E11D48}
.fact:nth-child(2){background:linear-gradient(145deg,#ECFDF9,#C9F7EE)}.fact:nth-child(2) b{color:#0D9488}
.fact:nth-child(3){background:linear-gradient(145deg,#FFF7EC,#FFE6C7)}.fact:nth-child(3) b{color:#C2410C}
.cta-go .ms{font-size:20px;transition:transform .2s}
a.btn{text-decoration:none}
.cta:hover .cta-go .ms{transform:translateX(4px)}
.instr{padding:18px 20px;display:grid;gap:14px}
.instr h3{font-size:1.05rem}
.instr-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.ins{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface-2)}
.ins b{display:block;font-size:.95rem}
.ins span:not(.ms){font-size:.84rem;color:var(--muted);line-height:1.3}
.instr-foot{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink-2)}
.instr-foot .ms{color:var(--green);font-size:20px}
.row-link{display:flex;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap}
.rl-txt{flex:1;min-width:200px;display:grid;gap:2px}
.rl-txt span{font-size:.9rem;color:var(--muted)}
/* encuesta */
.step-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.step-ico{width:50px;height:50px;border-radius:15px;background:linear-gradient(150deg,#FF3D63,#E11D48);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(225,29,72,.22)}
.step-ico .ms{font-size:27px}
.rail li.done .dot{background:var(--primary);border-color:var(--primary)}
.rail .dot .ms{font-size:16px}
.rail li button[aria-current="step"]{background:var(--accent-soft)}
.rail li button[aria-current="step"] .dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(13,148,136,.18)}
.stepper{list-style:none;margin:0;padding:4px 2px;display:flex;align-items:center}
.stepper li{display:flex}
.stepper .ln{flex:1;height:3px;background:var(--line);min-width:4px;margin:0 2px;border-radius:2px}
.stepper .ln.on{background:var(--seq3)}
.stepper .sd{width:30px;height:30px;border-radius:9px;border:0;display:grid;place-items:center;font-weight:800;font-size:.84rem;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2);cursor:pointer;padding:0;transition:transform .2s,box-shadow .2s}
.stepper .sd:disabled{cursor:default}
.stepper .sd.done{background:var(--primary);color:#fff;box-shadow:none}
.stepper .sd.done .ms{font-size:16px}
.stepper .sd.cur{background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(13,148,136,.2);transform:scale(1.08)}
.mp-cap{font-size:.9rem;color:var(--muted);margin-top:8px}
.mp-cap b{color:var(--ink)}
.mobile-progress{background:linear-gradient(var(--bg) 80%,transparent)}
.step{--pad:clamp(14px,2.6vw,26px);padding:var(--pad)}
.navwrap{position:sticky;bottom:0;z-index:12;margin:18px calc(-1 * var(--pad)) calc(-1 * var(--pad));padding:10px var(--pad) 12px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
.navwrap .err:empty{display:none}
.navwrap .navbar{margin:0;padding:0;border:0}
.opt .box{border-radius:14px;border-color:var(--line)}
.group{border-radius:18px;border-color:var(--line);background:#fff}
.cchoice .cc-box{border-radius:18px}
/* panel */
.search .ms{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px}
.kpi .ico{width:38px;height:38px;border-radius:12px}
.kpi .ico .ms{font-size:20px}
.adm-hero{border-radius:24px}
@media (max-width: 920px){
  .ctas{grid-template-columns:minmax(0,1fr)}
  .instr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 560px){
  .tabs a .ms{display:none}
  .brand-mark{width:38px;height:38px;border-radius:12px}
  .cta-top{height:96px}
  .cta-anim{width:100px;height:100px}
  .cta h2{font-size:1.3rem}
  .instr{padding:16px}
  .instr-grid{gap:8px}
  .ins{flex-direction:column;align-items:flex-start;gap:6px}
  .step-head{grid-template-columns:auto minmax(0,1fr)}
  .step-head .meta{grid-column:1/-1}
  .step-ico{width:44px;height:44px;border-radius:13px}
  .step-ico .ms{font-size:24px}

  return `<p class="crit ${c[0]}">${ms(c[0] === "inc" ? "check_circle" : "block")}<span><b>Criterio de ${c[0] === "inc" ? "inclusión" : "exclusión"}.</b> ${c[1]}</span></p>`;
}
function eligibility(st = S) {
  const f = st.ficha, out = [];
  if (f.moviliza === "No") out.push("No cumple inclusión: no realiza movilización o transferencia de pacientes");
  if (f.meses != null && f.meses !== "" && +f.meses < 3) out.push("No cumple inclusión: menos de 3 meses de actividad asistencial");
  if (f.condicion === "Egresado" && f.anosEgreso != null && f.anosEgreso !== "" && +f.anosEgreso > 6) out.push("No cumple inclusión: más de 6 años de egreso");
  if (f.reuma === "Sí") out.push("Exclusión: diagnóstico de enfermedad reumatológica sistémica");
  if (f.embarazo === "Sí") out.push("Exclusión: embarazo en curso");
  if (f.licencia === "Sí") out.push("Exclusión: descanso médico o licencia");
  return out;
}

function fichaError(f = S.ficha) {
  for (const q of FICHA) {
    if (!q.id) continue; if (q.only && f.condicion !== q.only) continue;
    const v = f[q.id];
    if (v == null || v === "") return { id: q.id, msg: `Falta responder: «${q.t}».` };
    if (q.type === "number" && (v < q.min || v > q.max)) return { id: q.id, msg: `Revise el valor de «${q.t}» (entre ${q.dec ? q.min.toFixed(q.dec) : q.min} y ${q.dec ? q.max.toFixed(q.dec) : q.max} ${q.unit}).` };
    if (q.dec && Math.round(v * 10 ** q.dec) / 10 ** q.dec !== v) return { id: q.id, msg: `Escriba «${q.t}» con ${q.dec} decimales como máximo (por ejemplo, ${q.ph}).` };
  }
  if (f.condicion !== S.meta.estrato) return { id: "condicion", msg: "La condición no coincide con el estrato registrado." };
  if (f.sexo === "Masculino" && f.embarazo === "Sí") return { id: "embarazo", msg: "La respuesta de embarazo no es compatible con el sexo registrado." };
  if (f.sexo === "Femenino" && f.embarazo === "No aplica") return { id: "embarazo", msg: "Indique «Sí» o «No» en la pregunta de embarazo." };
  return null;
}

    $("#elig", host).innerHTML = e.length ? `<div class="banner bad"><div><b>Participante no elegible.</b>${inc.length ? `<p style="margin-top:6px"><b>No cumple criterio de inclusión:</b></p><ul>${inc.map(it).join("")}</ul>` : ""}${exc.length ? `<p style="margin-top:6px"><b>Cumple criterio de exclusión:</b></p><ul>${exc.map(it).join("")}</ul>` : ""}<p style="margin-top:6px">Si se confirma, regístrelo como no elegible y seleccione al siguiente participante del mismo estrato.</p></div></div>` : "";
  };
  FICHA.filter(q => q.id).forEach(q => {

    else { const el = $(`#f-${q.id}`, host); el.oninput = () => { el.closest(".q").classList.remove("invalid"); f[q.id] = q.type === "number" ? (el.value === "" ? "" : +el.value) : el.value; persist(); updElig(); };
      if (q.dec) el.onblur = () => { if (el.value !== "" && Math.round(+el.value * 10 ** q.dec) / 10 ** q.dec === +el.value) el.value = (+el.value).toFixed(q.dec); }; }

  nav(host, { onNext: () => {

    if (e) { if (e.id) $(`#q-${e.id}`, host).classList.add("invalid"); return e.msg; }

    return null; } });
}

/* ---------- 4. NASA-TLX ---------- */
function radarSVG(vals) {
  const cx = 150, cy = 150, R = 105, n = 6;
  const pt = (i, r) => polar(cx, cy, r, i * 360 / n);
  let g = "";
  [25, 50, 75, 100].forEach(l => { g += `<polygon points="${[...Array(n)].map((_, i) => pt(i, R * l / 100).map(v => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  NASA.forEach((x, i) => { const [ax, ay] = pt(i, R); g += `<line x1="${cx}" y1="${cy}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}" stroke="var(--line)"/>`; const [lx, ly] = pt(i, R + 22); g += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="var(--ink-2)" font-family="Atkinson Hyperlegible, sans-serif">${x.t.replace("Exigencia ", "Exig. ")}</text>`; });
  const pts = NASA.map((x, i) => pt(i, R * (vals[x.id] ?? 0) / 100));
  g += `<polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="var(--primary)" fill-opacity=".22" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach(([x, y], i) => { if (vals[NASA[i].id] != null) g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="var(--primary)" stroke="var(--surface)" stroke-width="2"/>`; });
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Perfil de carga de trabajo">${g}</svg>`;
}

  started: false, rows: null, err: null, links: {}, filt: { estrato: "", estado: "", q: "", desde: "", hasta: "" },

  start() {

  // lee la tabla «Encuestas» completa; las fotos se piden aparte cuando se muestran

    if (T === "avance") {
      const lv = [0, 0, 0, 0, 0]; compF.forEach(r => { const l = rebaLevel(r.puntajes?.rebaFinal); if (l) lv[l.n - 1]++; });
      const lvTot = lv.reduce((a, b) => a + b, 0), maxLv = Math.max(1, ...lv);
      const nasaVals = compF.map(r => r.puntajes?.nasa).filter(v => v != null).sort((a, b) => a - b);
      const med = nasaVals.length ? (nasaVals.length % 2 ? nasaVals[(nasaVals.length - 1) / 2] : (nasaVals[nasaVals.length / 2 - 1] + nasaVals[nasaVals.length / 2]) / 2) : null;
      const prev12 = compF.length ? compF.filter(r => r.puntajes?.sintomas12m).length / compF.length * 100 : null;
      const regPrev = REGIONS.map(rg => ({ t: rg.t, n: compF.filter(r => (r.puntajes?.regiones12m || []).includes(rg.id)).length })).map(x => ({ ...x, p: compF.length ? x.n / compF.length * 100 : 0 })).sort((a, b) => b.p - a.p);
      // últimos 14 días hasta hoy
      const end = new Date(); const days14 = [...Array(14)].map((_, k) => { const d = new Date(end); d.setDate(end.getDate() - 13 + k); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; });
      const byDay = {}; rowsF.forEach(r => { if (r.fecha) byDay[r.fecha] = (byDay[r.fecha] || 0) + 1; });
      const max14 = Math.max(1, ...days14.map(d => byDay[d] || 0)), tot14 = days14.reduce((a, d) => a + (byDay[d] || 0), 0);
      const byEnc = {}; rowsF.forEach(r => { const n = r.dispositivo || "Sin dato"; byEnc[n] = (byEnc[n] || 0) + 1; });
      const encs = Object.entries(byEnc).sort((a, b) => b[1] - a[1]), maxEnc = Math.max(1, ...encs.map(x => x[1]));

        ${kcard(3, "person", "Internos", it, CFG.meta.interno, "var(--s2)", `Faltan ${Math.max(0, CFG.meta.interno - it)}`)}

      </div>
      <div class="admin-grid">
        <div class="card panel anim grow" style="--i:5">${panelH("fact_check", "t-primary", "Encuestas vs. muestra", "Meta del estudio: 121 (68 egresados y 53 internos).")}
          <div class="donuts">${donut(pct(comp.length, CFG.meta.total), "var(--primary)", 1, "Total", `${comp.length} de ${CFG.meta.total}`)}${donut(pct(eg, CFG.meta.egresado), "var(--s1)", 0, "Egresados", `${eg} de ${CFG.meta.egresado}`)}${donut(pct(it, CFG.meta.interno), "var(--s2)", 0, "Internos", `${it} de ${CFG.meta.interno}`)}</div></div>

          <div class="donuts">${donut(acept, "var(--good)", 0, "Aceptación", `${comp.length} aceptaron · ${rech} no`)}${donut(pct(fotosSi, comp.length), "var(--accent)", 0, "Fotos autorizadas", `${fotosSi} de ${comp.length}`)}</div>
          <p class="note" style="margin-top:10px">${ms("shield_person")} Registro anónimo: sin nombre, DNI ni firma.</p></div>
      </div>
      <div class="admin-grid">
        <div class="card panel anim grow" style="--i:7">${panelH("calendar_month", "t-primary", "Registros por día", `Últimos 14 días · ${tot14} registro(s)`)}
          <div class="d14">${days14.map((d, k) => `<div class="c" style="--d:${k}" data-tip="${d.slice(8, 10)}/${d.slice(5, 7)}: ${byDay[d] || 0} registro(s)"><b>${byDay[d] || ""}</b><i class="col" style="height:${((byDay[d] || 0) / max14 * 100).toFixed(1)}%"></i></div>`).join("")}</div>
          <div class="d14x">${days14.map(d => `<span>${d.slice(8, 10)}</span>`).join("")}</div></div>

          <div class="hbars">${encs.map(([n, c], i) => `<div class="hbar" style="--d:${i}" data-tip="${esc(n)}: ${c} registro(s)"><span>${esc(n)}</span><div class="track"><div class="fill" style="width:${(c / maxEnc * 100).toFixed(1)}%;background:var(--violet)"></div></div><span class="v mono">${c}</span></div>`).join("")}</div></div>

      ${compF.length ? `<div class="admin-grid">
        <div class="card panel anim grow" style="--i:9">${panelH("accessibility_new", "t-accent", "Síntomas en los últimos 12 meses", `Al menos una región: <b class="mono">${prev12 == null ? "—" : fmt(prev12) + " %"}</b> de ${compF.length}`)}
          <div class="hbars">${regPrev.map((x, i) => `<div class="hbar" style="--d:${i}" data-tip="${esc(x.t)}: ${x.n} de ${compF.length} (${fmt(x.p)} %)"><span>${esc(x.t)}</span><div class="track"><div class="fill" style="width:${x.p.toFixed(1)}%;background:linear-gradient(90deg,var(--seq3),var(--seq5))"></div></div><span class="v mono">${x.p.toFixed(0)} %</span></div>`).join("")}</div></div>

        $$("tr[data-id]", tb).forEach(tr => { const open = () => this.detail(rows.find(r => r.id === tr.dataset.id)); tr.onclick = open; tr.onkeydown = e => { if (e.key === "Enter") open(); }; });

  // ---------- pestaña de fotos: filtros, selección y descarga .zip ----------

      <p class="muted">Anótelo y compártalo solo con el equipo de investigación. Por seguridad no se volverá a mostrar; si lo pierde, genere uno nuevo desde el panel.${enter ? "" : " El código anterior ya no funciona."}</p>
      <button class="btn btn-primary" id="ov-ok">${enter ? `${ms("login")} Entrar al panel` : "Entendido"}</button></div>`;
    document.body.appendChild(ov);
    $("#ov-copy", ov).onclick = async () => { try { await navigator.clipboard.writeText(code); toast("Código copiado"); } catch { const r = document.createRange(); r.selectNodeContents($("#ov-code", ov)); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(r); toast("Seleccionado: cópielo con Ctrl+C"); } };
    $("#ov-ok", ov).onclick = () => { ov.remove(); if (enter) { Admin.unlocked = true; Admin.start(); } };
    $("#ov-ok", ov).focus();
  },
  change() {
    const ov = document.createElement("div"); ov.className = "overlay";
    ov.innerHTML = `<div class="card ov-card" role="dialog" aria-modal="true" aria-labelledby="ov-t"><span class="tile t-amber lg">${ms("key")}</span><h2 id="ov-t">¿Generar un nuevo código?</h2>
      <p class="muted">El código actual dejará de funcionar y tendrá que compartir el nuevo con el equipo.</p>
      <div class="toolbar" style="justify-content:center"><button class="btn btn-ghost" id="ov-no">Cancelar</button><button class="btn btn-accent" id="ov-yes">${ms("autorenew")} Generar nuevo código</button></div></div>`;
    document.body.appendChild(ov);
    $("#ov-no", ov).onclick = () => ov.remove();
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
    $("#ov-yes", ov).onclick = () => { ov.remove(); this.assign(false); };
  },
  // expirada = la sesión venció (6 h) o el código cambió en otro dispositivo
  logout(expirada) { ses.del(); Admin.unlocked = false; Admin.rows = null; Admin.err = null; Admin.started = false; Admin.shown = false; Admin.sel.clear(); Admin.srcs.clear();
    if (expirada) { toast("La sesión venció: ingrese de nuevo el código"); Gate.show(); } else { location.hash = "#inicio"; toast("Sesión de administración cerrada"); } }
};

/* =====================================================================
   MODO AUDIO: lee cada pregunta en voz alta y permite responder con la voz.
   Funciona sobre las preguntas ya dibujadas (.q, .subq, .field con .q-label),
   así sirve para todos los instrumentos sin cambiar cada paso.
   ===================================================================== */
const Voz = {
  on: true,   // los botones Escuchar y Responder están siempre en todas las preguntas
  SR: window.SpeechRecognition || window.webkitSpeechRecognition || null,
  tts: "speechSynthesis" in window,
  init() {
    const live = document.createElement("div"); live.id = "aud-live"; live.className = "sr-only"; live.setAttribute("aria-live", "polite"); document.body.appendChild(live);
    // vuelve a preparar las preguntas cada vez que cambia el paso
    let t; new MutationObserver(() => { clearTimeout(t); t = setTimeout(() => this.enhance(), 60); }).observe(document.body, { childList: true, subtree: true });
    if (this.tts) speechSynthesis.getVoices();
  },
  show(r) { if (r !== "encuesta") this.stop(); },
  voice() {
    const vs = this.tts ? speechSynthesis.getVoices() : [];
    return ["es-PE", "es-419", "es-US", "es-MX", "es-ES"].map(l => vs.find(v => v.lang === l || v.lang.replace("_", "-") === l)).find(Boolean) || vs.find(v => /^es/i.test(v.lang)) || null;
  },
  say(text, btn) {
    if (!this.tts || !text) return;
    speechSynthesis.cancel(); $$(".aud .a-say.on").forEach(b => b.classList.remove("on"));
    const u = new SpeechSynthesisUtterance(text); const v = this.voice();
    u.lang = v ? v.lang : "es-PE"; if (v) u.voice = v; u.rate = 0.95;
    if (btn) { btn.classList.add("on"); u.onend = u.onerror = () => btn.classList.remove("on"); }
    speechSynthesis.speak(u);
  },
  stop() { if (this.tts) speechSynthesis.cancel(); if (this.rec) { try { this.rec.abort(); } catch {} this.rec = null; } $$(".aud button.on").forEach(b => b.classList.remove("on")); },
  announce(t) { const l = $("#aud-live"); if (l) { l.textContent = ""; setTimeout(() => { l.textContent = t; }, 30); } },
  // ---------- qué es una pregunta y qué opciones tiene ----------
  units(root) {
    return $$(".q, .subq, .field", root).filter(u => {
      if (u.querySelector(".subq")) return false;                 // la región del Nórdico se lee por sus subpreguntas
      if (u.closest(".subq") && !u.classList.contains("subq")) return false;
      return !!this.label(u) && !!u.querySelector("input:not([type=hidden]), select, textarea");
    });
  },
  label(u) { const l = u.querySelector(".q-label, h3, label[for]"); return l ? l.textContent.replace(/\s+/g, " ").trim() : ""; },
  radios(u) { return $$("input[type=radio]", u).filter(r => !r.closest("[hidden]")); },
  optText(r) {
    const a = r.getAttribute("aria-label"); if (a) return a.replace(/^\d+\s+/, "");   // escala de Warr: «1 Muy insatisfecho»
    const l = r.closest("label"); if (!l) return r.value;
    const b = l.querySelector(".cc-txt b"); if (b) return b.textContent.trim();          // consentimiento
    return l.textContent.replace(/\s+/g, " ").trim() || r.value;
  },
  // código asignado al azar o fecha: se escuchan pero no se dictan
  noMic(u) { const f = this.radios(u).length ? null : this.field(u); return !!f && (f.readOnly || f.type === "date"); },
  field(u) { return u.querySelector("input[type=number], input[type=range], input.input:not([type=radio]), textarea, select"); },
  text(u) {
    let t = this.label(u);
    const d = u.querySelector(".nasa-top + p"); if (d) t += ". " + d.textContent.trim();
    const rs = this.radios(u);
    if (rs.length) {
      const opts = [...new Set(rs.map(r => this.optText(r)))];
      t += ". Opciones: " + opts.join("; ") + ".";
      const c = rs.find(r => r.checked); if (c) t += " Respuesta actual: " + this.optText(c) + ".";
    } else {
      const f = this.field(u);
      if (f && f.type === "range") { const e = u.querySelectorAll(".ends span"); t += `. Diga un número de 0 a 100${e.length ? `, donde 0 es ${e[0].textContent} y 100 es ${e[1].textContent}` : ""}.`; }
      else if (f && f.type === "number") { const unit = f.parentElement.querySelector(".muted"); t += `. Diga un número${unit ? " en " + unit.textContent.trim() : ""}.`; }
      else if (f && f.tagName === "SELECT") t += ". Opciones: " + [...f.options].filter(o => o.value).map(o => o.text).join("; ") + ".";
      else t += ". Diga su respuesta.";
      if (f && f.value && f.type !== "range") t += " Respuesta actual: " + f.value + ".";
    }
    return t;
  },
  // ---------- etiquetas para lectores de pantalla (siempre activas) ----------
  a11y(u) {
    const lab = this.label(u);
    $$("[role=radiogroup]", u).forEach(g => { if (!g.getAttribute("aria-label")) g.setAttribute("aria-label", lab); });
    const f = this.field(u); if (f && !f.getAttribute("aria-label") && !(f.id && document.querySelector(`label[for="${f.id}"]`))) f.setAttribute("aria-label", lab);
  },
  enhance() {
    const step = $("#step"); if (!step) return;
    this.units(step).forEach(u => {
      this.a11y(u);
      if (!this.on || u.querySelector(":scope > .aud, :scope > .q-head > .aud")) return;
      const bar = document.createElement("div"); bar.className = "aud";
      const lab = this.label(u);
      bar.innerHTML = (this.tts ? `<button type="button" class="a-say" aria-label="Escuchar: ${esc(lab)}">${ms("volume_up")}<span class="t">Escuchar</span></button>` : "")
        + (this.SR && !this.noMic(u) ? `<button type="button" class="a-mic" aria-label="Responder con la voz: ${esc(lab)}">${ms("mic")}<span class="t">Responder</span></button>` : "");
      if (!bar.children.length) return;
      const sb = bar.querySelector(".a-say"); if (sb) sb.onclick = () => { if (sb.classList.contains("on")) { this.stop(); return; } this.say(this.text(u), sb); };
      const mb = bar.querySelector(".a-mic"); if (mb) mb.onclick = () => this.listen(u, mb);
      const qh = u.querySelector(":scope > .q-head"), ql = u.querySelector(":scope > .q-label, :scope > .nasa-top");
      if (qh) qh.appendChild(bar); else if (ql) ql.after(bar); else u.prepend(bar);
    });
    const sh = step.querySelector(".step-head .sh-txt");
    if (sh && this.tts && !sh.querySelector(".aud")) {
      const bar = document.createElement("div"); bar.className = "aud";
      bar.innerHTML = `<button type="button" class="a-say" aria-label="Escuchar las instrucciones de este paso">${ms("volume_up")}<span class="t">Escuchar instrucciones</span></button>`;
      const b = bar.firstChild; b.onclick = () => { if (b.classList.contains("on")) { this.stop(); return; } this.readHead(b); };
      sh.appendChild(bar);
    }
  },
  readHead(btn) { const h = $("#step h2"), l = $("#step .step-head .lead"); if (h) this.say(h.textContent + (l ? ". " + l.textContent : ""), btn); },
  // ---------- responder con la voz ----------
  listen(u, btn) {
    if (!this.SR) return;
    if (this.rec) { this.stop(); return; }
    if (this.tts) speechSynthesis.cancel();
    const rec = new this.SR(); this.rec = rec;
    rec.lang = "es-PE"; rec.interimResults = false; rec.maxAlternatives = 4; rec.continuous = false;
    btn.classList.add("on"); btn.setAttribute("aria-label", "Escuchando… toque para detener");
    const done = () => { btn.classList.remove("on"); btn.setAttribute("aria-label", "Responder con la voz: " + this.label(u)); if (this.rec === rec) this.rec = null; };
    rec.onresult = e => { const alts = [...e.results[0]].map(a => a.transcript); this.apply(u, alts); };
    rec.onerror = e => { done(); const m = e.error === "not-allowed" || e.error === "service-not-allowed" ? "Permita el uso del micrófono en el navegador para responder con la voz." : e.error === "no-speech" ? "No se escuchó nada. Toque Responder e intente de nuevo." : "No se pudo usar el micrófono."; toast(m); this.say(m); };
    rec.onend = done;
    try { rec.start(); } catch { done(); }
  },
  norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ.,\s]/g, " ").replace(/\s+/g, " ").trim(); },
  NUM: { cero: 0, uno: 1, una: 1, un: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, treinta: 30, cuarenta: 40, cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80, noventa: 90, cien: 100 },
  number(t) {
    const n = this.norm(t);
    const m = n.match(/\d+(?:[.,]\d+)?/); if (m) return parseFloat(m[0].replace(",", "."));
    // números dichos en palabras: «treinta y cinco», «uno sesenta y cinco» (1,65)
    const w = n.split(" ").filter(x => x !== "y"); let tot = 0, any = false, parts = [];
    w.forEach(x => { if (x in this.NUM) { any = true; tot += this.NUM[x]; } else if (any && /^(coma|punto|con|metro|metros)$/.test(x)) { parts.push(tot); tot = 0; } });
    if (!any) return null; parts.push(tot);
    if (parts.length === 1 && w.length > 1 && w[0] in this.NUM && this.NUM[w[0]] < 10 && w.slice(1).some(x => this.NUM[x] >= 20)) { const r = w.slice(1).reduce((a, x) => a + (this.NUM[x] || 0), 0); return +(this.NUM[w[0]] + "." + String(r).padStart(2, "0")); }
    return parts.length > 1 ? +(parts[0] + "." + parts[1]) : parts[0];
  },
  apply(u, alts) {
    const heard = alts[0] || "";
    const rs = this.radios(u);
    let ok = null;
    if (rs.length) {
      for (const a of alts) {
        const t = " " + this.norm(a) + " ";
        const cands = rs.map(r => ({ r, o: this.norm(this.optText(r)) })).filter(c => c.o);
        let hit = cands.find(c => t.trim() === c.o) || cands.filter(c => t.includes(" " + c.o + " ")).sort((x, y) => y.o.length - x.o.length)[0];
        if (!hit) { const n = this.number(a); const pos = /opcion|numero/.test(t) && n != null ? cands[n - 1] : null; hit = pos || (n != null ? cands.find(c => c.r.value === String(n)) : null); }
        if (!hit && /^\s*si\s*$/.test(t)) hit = cands.find(c => /^si\b/.test(c.o));
        if (hit) { ok = hit; break; }
      }
      if (ok) { ok.r.checked = true; ok.r.dispatchEvent(new Event("change", { bubbles: true })); ok.r.dispatchEvent(new Event("input", { bubbles: true })); }
    } else {
      const f = this.field(u);
      if (f && (f.type === "number" || f.type === "range")) {
        let n = null; for (const a of alts) { n = this.number(a); if (n != null) break; }
        if (n != null) {
          if (f.type === "range") n = Math.max(0, Math.min(100, Math.round(n / 5) * 5));
          f.value = String(n); f.dispatchEvent(new Event("input", { bubbles: true })); f.dispatchEvent(new Event("change", { bubbles: true })); f.dispatchEvent(new Event("blur"));
          ok = { text: f.value };
        }
      } else if (f && f.tagName === "SELECT") {
        const t = this.norm(heard); const o = [...f.options].find(o => o.value && t.includes(this.norm(o.text)));
        if (o) { f.value = o.value; f.dispatchEvent(new Event("change", { bubbles: true })); ok = { text: o.text }; }
      } else if (f) {
        f.value = heard.charAt(0).toUpperCase() + heard.slice(1); f.dispatchEvent(new Event("input", { bubbles: true })); ok = { text: f.value };
      }
    }
    const said = ok ? (ok.r ? this.optText(ok.r) : ok.text) : null;
    const msg = said ? `Registrado: ${said}.` : `No entendí «${heard}». ${this.radios(u).length ? "Diga una de las opciones." : "Intente de nuevo."}`;
    // la pregunta puede volver a dibujarse al responder (Nórdico); se busca de nuevo por id
    const cur = (u.id && document.getElementById(u.id)) || u;
    let note = cur.querySelector(".aud-heard"); const bar = cur.querySelector(".aud");
    if (bar) { if (!note) { note = document.createElement("span"); note.className = "aud-heard"; bar.appendChild(note); } note.textContent = `Oído: «${heard}» · ${said ? "registrado: " + said : "sin coincidencia"}`; }
    this.announce(msg); this.say(msg);
  }
};

/* =====================================================================
   RUTAS
   ===================================================================== */
function route() { return location.hash === "#admin" ? "admin" : location.hash === "#encuesta" ? "encuesta" : "inicio"; }
function applyRoute() {
  const r = route();
  $("#view-home").hidden = r !== "inicio"; $("#view-enc").hidden = r !== "encuesta"; $("#view-adm").hidden = r !== "admin";
  $("#tab-home").setAttribute("aria-current", r === "inicio" ? "page" : "false");
  $("#tab-enc").setAttribute("aria-current", r === "encuesta" ? "page" : "false");
  $("#tab-adm").setAttribute("aria-current", r === "admin" ? "page" : "false");
  Voz.show(r);
  if (r === "admin") Admin.start(); else if (r === "encuesta") { S = store.get(DRAFT_KEY) || S; renderSurvey(); } else renderHome();
  window.scrollTo({ top: 0 });
}
function syncTopbar() { const t = $(".topbar"); if (t) document.documentElement.style.setProperty("--topbar-h", t.offsetHeight + "px"); }
if (window.ResizeObserver) new ResizeObserver(syncTopbar).observe($(".topbar")); else window.addEventListener("resize", syncTopbar);
syncTopbar();
window.addEventListener("hashchange", applyRoute);
Voz.init();
applyRoute();
initPlatform();
</script>
